services:
  - type: web
    name: srgpc-certificate-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: srgpc-certificate-db
          property: connectionString
      - key: SRGPC_SESSION_KEY
        sync: false
      - key: SRGPC_PUBLIC_BASE_URL
        sync: false
      - key: SRGPC_ADMIN_USERNAME
        sync: false
      - key: SRGPC_ADMIN_PASSWORD
        sync: false

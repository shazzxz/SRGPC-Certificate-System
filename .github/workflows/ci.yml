name: SRGPC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SRGPC_TESTING: "1"
      SRGPC_SESSION_KEY: "ci-session-key"
      SRGPC_ADMIN_USERNAME: "ADMIN"
      SRGPC_ADMIN_PASSWORD: "0000"
      SRGPC_DB_PATH: /tmp/srgpc-test.db
      SRGPC_GENERATED_DIR: /tmp/srgpc-generated
      SRGPC_SIGNATURE_DIR: /tmp/srgpc-signatures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

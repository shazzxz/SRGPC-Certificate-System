name: Android App

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add native Android bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/in/srgpc/certificates
          cat > android/app/src/main/java/in/srgpc/certificates/MainActivity.java <<'JAVA'
          package in.srgpc.certificates;

          import android.Manifest;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.URLUtil;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final int REQUEST_NOTIFICATIONS = 1101;
              private static final int REQUEST_STORAGE = 1102;
              private String pendingDownloadUrl;
              private String pendingDownloadUserAgent;
              private String pendingDownloadContentDisposition;
              private String pendingDownloadMimeType;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setupWebView();
                  handleIntent(getIntent());
                  requestNotificationPermission();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntent(intent);
              }

              private void setupWebView() {
                  WebView webView = getBridge().getWebView();
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {
                          pendingDownloadUrl = url;
                          pendingDownloadUserAgent = userAgent;
                          pendingDownloadContentDisposition = contentDisposition;
                          pendingDownloadMimeType = mimeType;
                          if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P &&
                              ActivityCompat.checkSelfPermission(MainActivity.this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                              ActivityCompat.requestPermissions(MainActivity.this,
                                  new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, REQUEST_STORAGE);
                              return;
                          }
                          enqueueDownload();
                      }
                  });
              }

              private void enqueueDownload() {
                  if (pendingDownloadUrl == null) return;
                  String cookie = CookieManager.getInstance().getCookie(pendingDownloadUrl);
                  String fileName = URLUtil.guessFileName(pendingDownloadUrl, pendingDownloadContentDisposition, pendingDownloadMimeType);
                  DownloadManager.Request request = new DownloadManager.Request(Uri.parse(pendingDownloadUrl));
                  request.setTitle(fileName);
                  request.setDescription("SRGPC certificate PDF");
                  request.setMimeType(pendingDownloadMimeType != null ? pendingDownloadMimeType : "application/pdf");
                  request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                  request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                  if (cookie != null) request.addRequestHeader("Cookie", cookie);
                  if (pendingDownloadUserAgent != null) request.addRequestHeader("User-Agent", pendingDownloadUserAgent);
                  DownloadManager manager = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                  manager.enqueue(request);
                  pendingDownloadUrl = null;
              }

              private void requestNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                      ActivityCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this,
                          new String[]{Manifest.permission.POST_NOTIFICATIONS}, REQUEST_NOTIFICATIONS);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQUEST_STORAGE && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      enqueueDownload();
                  }
              }

              private void handleIntent(Intent intent) {
                  if (intent == null || intent.getData() == null) return;
                  Uri data = intent.getData();
                  if ("srgpc".equalsIgnoreCase(data.getScheme()) && "oauth2callback".equalsIgnoreCase(data.getHost())) {
                      String token = data.getQueryParameter("token");
                      if (token != null && !token.isEmpty()) {
                          getBridge().getWebView().loadUrl("https://srgpc-certificate-system.onrender.com/auth/mobile/complete?token=" + Uri.encode(token));
                      }
                  }
              }
          }
          JAVA

          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                        '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />')
          marker = '        <activity'
          intent = '''        <activity
              android:name=".MainActivity"
              android:exported="true"
              android:launchMode="singleTask">
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="srgpc" android:host="oauth2callback" />
              </intent-filter>
          </activity>
'''
          # Capacitor's generated manifest already declares MainActivity; inject the intent-filter into it.
          needle = 'android:name=".MainActivity"'
          idx = s.find(needle)
          if idx < 0:
              raise SystemExit("MainActivity declaration not found")
          start = s.rfind("<activity", 0, idx)
          end = s.find("</activity>", idx)
          block = s[start:end+len("</activity>")]
          if 'android:scheme="srgpc"' not in block:
              block = block.replace("</activity>", '''                <intent-filter>
                    <action android:name="android.intent.action.VIEW" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <category android:name="android.intent.category.BROWSABLE" />
                    <data android:scheme="srgpc" android:host="oauth2callback" />
                </intent-filter>
            </activity>''')
              s = s[:start] + block + s[end+len("</activity>"):]
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: srgpc-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
